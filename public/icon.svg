<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.25" stroke-dasharray="12 8" />

  <!-- Ascending Wealth Bars -->
  <rect x="140" y="270" width="44" height="100" rx="8" fill="url(#bar1)" />
  <rect x="204" y="220" width="44" height="150" rx="8" fill="url(#bar2)" />
  <rect x="268" y="170" width="44" height="200" rx="8" fill="url(#bar3)" />
  <rect x="332" y="120" width="44" height="250" rx="8" fill="url(#bar4)" />

  <!-- Base Baseline -->
  <line x1="120" y1="372" x2="395" y2="372" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Upward Trendline -->
  <path d="M130 310 Q 195 255, 260 240 T 385 110" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Glowing Peak Node -->
  <circle cx="385" cy="110" r="14" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />

  <!-- Badge at bottom -->
  <rect x="146" y="400" width="220" height="44" rx="16" fill="url(#badge)" />
  <text x="256" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PORTFOLIO</text>
</svg>
